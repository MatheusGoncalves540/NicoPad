version: "3"

# Tudo o que precisa de Python fica isolado em .venv.
# Se `py -3.12` não existir na sua máquina, rode: task setup PY=python
vars:
  PY:
    sh: py -3.12 -V >/dev/null 2>&1 && echo "py -3.12" || (py -3 -V >/dev/null 2>&1 && echo "py -3" || echo python)
  VENV: .venv
  VENV_PY: "{{.VENV}}/Scripts/python.exe"
  SRC: src
  EXE: dist/nicopad/nicopad.exe
  SETUP: dist/nicopad-setup.exe
  # Só built-ins: o sh embutido do Task no Windows não tem `grep`/`head` no PATH.
  VERSION:
    sh: |
      while IFS= read -r line; do
        case "$line" in
          __version__*) v=${line#*\"}; echo "${v%%\"*}" ;;
        esac
      done < src/nicopad/__init__.py
  # Inno Setup: instalação por usuário (local) ou do choco (CI)
  ISCC:
    sh: for p in "$LOCALAPPDATA/Programs/Inno Setup 6" "C:/Program Files (x86)/Inno Setup 6" "C:/Program Files/Inno Setup 6"; do [ -f "$p/ISCC.exe" ] && echo "$p/ISCC.exe" && break; done

tasks:
  default:
    desc: Lista as tarefas disponíveis
    cmds:
      - task --list-all

  setup:
    desc: Cria o .venv e instala as dependências
    sources:
      - requirements.txt
    generates:
      - "{{.VENV_PY}}"
    cmds:
      - "{{.PY}} -m venv {{.VENV}}"
      - "{{.VENV_PY}} -m pip install --disable-pip-version-check -q -U pip"
      - "{{.VENV_PY}} -m pip install --disable-pip-version-check -q -r requirements.txt"

  run:
    desc: Abre o app direto pelo código-fonte
    deps: [setup]
    cmds:
      - "PYTHONPATH={{.SRC}} {{.VENV_PY}} -m nicopad"

  cable:
    desc: Prepara o instalador oficial do cabo de áudio virtual na sua pasta
    deps: [setup]
    cmds:
      - "PYTHONPATH={{.SRC}} {{.VENV_PY}} -m nicopad --install-cable"
  test:
    desc: Verificação automática do código-fonte (não abre a interface)
    deps: [setup]
    cmds:
      - "PYTHONPATH={{.SRC}} {{.VENV_PY}} -m nicopad --selftest"

  build:
    desc: Gera o app em dist/nicopad/ (pasta, sem instalador)
    deps: [setup]
    sources:
      - "{{.SRC}}/**/*.py"
      - packaging/nicopad.spec
      - packaging/fonts/*
    generates:
      - "{{.EXE}}"
    cmds:
      - "{{.VENV_PY}} -m PyInstaller --clean --noconfirm --distpath dist --workpath build packaging/nicopad.spec"

  installer:
    desc: Gera o instalador dist/nicopad-setup.exe (precisa do Inno Setup 6)
    deps: [build]
    cmds:
      - '"{{.ISCC}}" /Qp /DAppVersion={{.VERSION}} packaging/nicopad.iss'

  verify:
    desc: Roda a verificação dentro do executável compilado
    deps: [build]
    cmds:
      - "./{{.EXE}} --selftest"
      - cat nicopad-selftest.txt

  clean:
    desc: Apaga ambiente virtual, build e caches
    cmds:
      - rm -rf build dist {{.VENV}} nicopad-selftest.txt
      - find {{.SRC}} packaging -name __pycache__ -type d -exec rm -rf {} + || true
